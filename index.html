<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SILABNU — Laboratorium Keperawatan IIKNU</title>
  <meta name="description" content="Layanan peminjaman alat, kontrak ruangan, dan absensi Laboratorium Keperawatan IIKNU Tuban.">

  <!-- Identitas aplikasi -->
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#0D5C3A">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">

  <!-- Khusus iPhone -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SILABNU">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

  <style>
    :root {
      --hijau: #0D5C3A;
      --hijau-tua: #083D27;
      --kertas: #FFFFFF;
      --teks: #0F172A;
      --redup: #5B6B64;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--kertas); }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--teks);
      /* Konten tidak tertutup poni kamera dan bilah bawah iPhone */
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }

    #aplikasi {
      position: fixed; inset: 0;
      top: env(safe-area-inset-top, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      width: 100%; height: auto; border: 0;
      opacity: 0; transition: opacity .35s ease;
    }
    #aplikasi.siap { opacity: 1; }

    /* Layar pembuka selama SILABNU dimuat */
    #pembuka {
      position: fixed; inset: 0; z-index: 10;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: var(--kertas); padding: 24px; text-align: center;
      transition: opacity .35s ease;
    }
    #pembuka.hilang { opacity: 0; pointer-events: none; }
    #pembuka img { width: 96px; height: 96px; }
    #pembuka h1 { font-size: 22px; font-weight: 700; color: var(--hijau); letter-spacing: .01em; }
    #pembuka p { font-size: 14px; color: var(--redup); max-width: 30ch; line-height: 1.5; }
    .garis-muat {
      width: 140px; height: 3px; border-radius: 3px; background: #E3EBE7; overflow: hidden;
    }
    .garis-muat::after {
      content: ""; display: block; height: 100%; width: 40%; background: var(--hijau);
      animation: muat 1.1s ease-in-out infinite;
    }
    @keyframes muat { from { transform: translateX(-100%); } to { transform: translateX(260%); } }
    @media (prefers-reduced-motion: reduce) { .garis-muat::after { animation: none; width: 100%; } }

    /* Keterangan saat koneksi terputus */
    #luring {
      position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px));
      z-index: 20; display: none; background: var(--hijau-tua); color: #fff;
      border-radius: 12px; padding: 12px 14px; font-size: 14px; line-height: 1.45;
    }
    #luring.tampil { display: block; }
  </style>
</head>
<body>
  <div id="pembuka" role="status" aria-live="polite">
    <img src="icons/icon-192.png" alt="Logo IIKNU" width="96" height="96">
    <h1>SILABNU</h1>
    <p>Laboratorium Keperawatan Terpadu IIKNU Tuban</p>
    <div class="garis-muat" aria-hidden="true"></div>
  </div>

  <!--
    Alamat aplikasi Apps Script (sama dengan yang terpasang di tema Blogger).
    Ubah hanya bila Anda membuat deployment baru dengan alamat berbeda.
  -->
  <iframe
    id="aplikasi"
    title="SILABNU"
    allow="camera; clipboard-write; fullscreen"
    referrerpolicy="no-referrer-when-downgrade"
    src="https://script.google.com/macros/s/AKfycbzhJuFJ5Mer5MM8K3U5DQtATaKoZ5kJBtUDP5ql_N9q-9paRzL_IixBNFCfS7lsCPXB/exec">
  </iframe>

  <div id="luring" role="alert">
    Tidak ada koneksi internet. SILABNU akan dimuat ulang otomatis begitu koneksi kembali.
  </div>

  <script>
    const bingkai = document.getElementById('aplikasi');
    const pembuka = document.getElementById('pembuka');
    const luring = document.getElementById('luring');

    // Sembunyikan layar pembuka begitu SILABNU selesai dimuat
    function tampilkanAplikasi() {
      bingkai.classList.add('siap');
      pembuka.classList.add('hilang');
    }
    bingkai.addEventListener('load', tampilkanAplikasi);
    // Cadangan bila peristiwa load tidak terpicu
    setTimeout(tampilkanAplikasi, 12000);

    // Keterangan saat luring, lalu muat ulang ketika koneksi kembali
    function cekKoneksi() {
      luring.classList.toggle('tampil', !navigator.onLine);
    }
    window.addEventListener('offline', cekKoneksi);
    window.addEventListener('online', () => {
      cekKoneksi();
      bingkai.src = bingkai.src;
    });
    cekKoneksi();

    // Daftarkan service worker agar aplikasi dapat diinstal
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
