<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SILABNU — Laboratorium Keperawatan IIKNU</title>
  <meta name="description" content="Layanan peminjaman alat, kontrak ruangan, dan absensi Laboratorium Keperawatan IIKNU Tuban.">
  <meta name="theme-color" content="#0D5C3A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="SILABNU">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <style>
    /* KUNCI PERBAIKAN: halaman dan iframe dipaksa setinggi jendela */
    html, body {
      margin: 0; padding: 0;
      width: 100%; height: 100%;
      overflow: hidden;
      background: #0D5C3A;
    }
    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #fff;
    }

    /* Layar pembuka, menutupi iframe sampai GAS selesai dimuat */
    #splash {
      position: fixed; inset: 0; z-index: 2;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 12px;
      background: #0D5C3A; color: #fff;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center; padding: 24px;
      transition: opacity .35s ease;
    }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash img { width: 88px; height: 88px; border-radius: 20px; background: #fff; padding: 6px; }
    #splash strong { font-size: 1.05rem; font-weight: 600; }
    #splash span { font-size: .85rem; opacity: .8; }
    #splash a { color: #fff; font-size: .8rem; opacity: .7; margin-top: 16px; }

    /* Pesan offline */
    #offline {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 3;
      display: none;
      padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px));
      background: #7a1f1f; color: #fff;
      font: .85rem system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    #offline.show { display: block; }

    @media (prefers-reduced-motion: reduce) { #splash { transition: none; } }
  </style>
</head>
<body>
  <iframe id="app"
    src="https://script.google.com/macros/s/AKfycbzhJuFJ5Mer5MM8K3U5DQtATaKoZ5kJBtUDP5ql_N9q-9paRzL_IixBNFCfS7lsCPXB/exec"
    title="SILABNU"
    allow="camera; clipboard-write"></iframe>

  <div id="splash">
    <img src="icons/icon-192.png" alt="Logo IIKNU">
    <strong>Menyiapkan SILABNU…</strong>
    <span>Portal Layanan Laboratorium Keperawatan IIKNU</span>
    <a id="direct" href="https://script.google.com/macros/s/AKfycbzhJuFJ5Mer5MM8K3U5DQtATaKoZ5kJBtUDP5ql_N9q-9paRzL_IixBNFCfS7lsCPXB/exec" target="_blank" rel="noopener" hidden>Buka langsung di browser</a>
  </div>

  <div id="offline">Tidak ada koneksi internet. SILABNU akan dimuat ulang otomatis begitu koneksi kembali.</div>

  <script>
    var app = document.getElementById('app');
    var splash = document.getElementById('splash');

    app.addEventListener('load', function () { splash.classList.add('hide'); });
    // Kalau GAS lambat, tampilkan tautan cadangan setelah 12 detik
    setTimeout(function () { document.getElementById('direct').hidden = false; }, 12000);

    var offline = document.getElementById('offline');
    function cekKoneksi() { offline.classList.toggle('show', !navigator.onLine); }
    window.addEventListener('offline', cekKoneksi);
    window.addEventListener('online', function () { cekKoneksi(); app.src = app.src; });
    cekKoneksi();

    // Sesuaikan nama file service worker dengan yang ada di repo
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function () {});
    }
  </script>
</body>
</html>
